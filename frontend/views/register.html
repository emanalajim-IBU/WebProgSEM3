<div class="auth-wrapper d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-4 col-lg-5 col-md-7">
        <div class="card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <img src="static/img/logo.svg" alt="" width="56" height="56" class="mb-3">
              <h1 class="h4 page-title">Create an account</h1>
              <p class="text-muted mb-0">Register as a resident</p>
            </div>
            <form data-static-action="register">
              <div class="mb-3">
                <label for="registerName" class="form-label">Full name</label>
                <input type="text" class="form-control" id="registerName" name="full_name" required>
              </div>
              <div class="mb-3">
                <label for="registerEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="registerEmail" name="email" required>
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="registerPassword" name="password" minlength="8" required>
              </div>
              <div class="mb-3">
                <label for="registerConfirm" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="registerConfirm" name="confirm_password" minlength="8" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <hr>
            <p class="text-center small mb-0">Already registered? <a href="#/login">Login</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
