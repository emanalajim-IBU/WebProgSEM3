<div class="auth-wrapper d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-4 col-lg-5 col-md-7">
        <div class="card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <img src="static/img/logo.svg" alt="" width="56" height="56" class="mb-3">
              <h1 class="h4 page-title">Building Management System</h1>
              <p class="text-muted mb-0">Sign in to your account</p>
            </div>
            <form data-static-action="login">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" name="email" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <hr>
            <p class="text-center small mb-0">New resident? <a href="#/register">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
