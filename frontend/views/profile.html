<h1 class="h3 page-title mb-4">Profile</h1>
<div class="row g-4">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">Account details</div>
      <div class="card-body">
        <form>
          <div class="mb-3"><label for="profileName" class="form-label">Full name</label><input type="text" class="form-control" id="profileName" name="full_name" value="Eman Alajim" required></div>
          <div class="mb-3"><label for="profileEmail" class="form-label">Email</label><input type="email" class="form-control" id="profileEmail" name="email" value="eman.alajim@stu.ibu.edu.ba" required></div>
          <div class="mb-3"><label for="profileRole" class="form-label">Role</label><input type="text" class="form-control" id="profileRole" value="admin" disabled></div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">Change password</div>
      <div class="card-body">
        <form>
          <div class="mb-3"><label for="currentPassword" class="form-label">Current password</label><input type="password" class="form-control" id="currentPassword" name="current_password" required></div>
          <div class="mb-3"><label for="newPassword" class="form-label">New password</label><input type="password" class="form-control" id="newPassword" name="new_password" minlength="8" required></div>
          <div class="mb-3"><label for="confirmPassword" class="form-label">Confirm new password</label><input type="password" class="form-control" id="confirmPassword" name="confirm_password" minlength="8" required></div>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
